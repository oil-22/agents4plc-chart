<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents4PLC 对比 · 详细脚手架</title>
<style>
:root { color-scheme: light; }
html[data-theme="dark"] { color-scheme: dark; }

.viz-root {
  /* 表面与墨水 */
  --surface-1: #fcfcfb;
  --page:      #f9f9f7;
  --ink-1:     #0b0b0b;
  --ink-2:     #52514e;
  --muted:     #898781;
  --grid:      #e1e0d9;
  --axis:      #c3c2b7;
  --border:    rgba(11,11,11,.10);
  --focus:     rgba(42,120,214,.35);
  /* 分类色（固定顺序，色随实体不随排名） */
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --series-4: #eda100;
  --series-5: #e87ba4;
  --series-6: #008300;
  --series-7: #4a3aa7;
  --series-8: #e34948;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .viz-root {
    --surface-1: #1a1a19;
    --page:      #0d0d0d;
    --ink-1:     #ffffff;
    --ink-2:     #c3c2b7;
    --muted:     #898781;
    --grid:      #2c2c2a;
    --axis:      #383835;
    --border:    rgba(255,255,255,.10);
    --focus:     rgba(57,135,229,.45);
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --series-5: #d55181;
    --series-6: #008300;
    --series-7: #9085e9;
    --series-8: #e66767;
  }
}
:root[data-theme="dark"] .viz-root {
  --surface-1: #1a1a19;
  --page:      #0d0d0d;
  --ink-1:     #ffffff;
  --ink-2:     #c3c2b7;
  --muted:     #898781;
  --grid:      #2c2c2a;
  --axis:      #383835;
  --border:    rgba(255,255,255,.10);
  --focus:     rgba(57,135,229,.45);
  --series-1: #3987e5;
  --series-2: #d95926;
  --series-3: #199e70;
  --series-4: #c98500;
  --series-5: #d55181;
  --series-6: #008300;
  --series-7: #9085e9;
  --series-8: #e66767;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--page);
  color: var(--ink-1);
  font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  -webkit-font-smoothing: antialiased;
}
main.card {
  max-width: 1400px;
  margin: 28px auto;
  padding: 28px 32px 18px;
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 12px;
}
header.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
h1 { font-size: 19px; font-weight: 650; margin: 0 0 6px; }
p.sub { font-size: 12.5px; color: var(--ink-2); margin: 0; }
.head-ctrls { display: flex; gap: 8px; flex: none; }
.icon-btn {
  font: inherit; font-size: 12px; color: var(--ink-2);
  background: transparent; border: 1px solid var(--border); border-radius: 8px;
  padding: 5px 10px; cursor: pointer;
}
.icon-btn:hover { background: var(--grid); }
.icon-btn[aria-pressed="true"] { color: var(--ink-1); border-color: var(--ink-2); }

/* 筛选行：指标 / 模型 / 表格视图 */
.filters {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  margin: 18px 0 4px;
}
.f-group { display: flex; align-items: center; gap: 6px; }
.f-label { font-size: 12px; color: var(--muted); margin-right: 2px; }
.filters .sep { width: 1px; height: 18px; background: var(--border); margin: 0 10px; }
.tab {
  font: inherit; font-size: 12.5px; color: var(--ink-2);
  background: transparent; border: 1px solid var(--border); border-radius: 999px;
  padding: 5px 14px; cursor: pointer; white-space: nowrap;
}
.tab:hover { background: var(--grid); }
.tab.active { color: var(--ink-1); border-color: var(--ink-2); font-weight: 600; }
#btnTable { margin-left: auto; }

.ctx { font-size: 13px; color: var(--ink-2); margin: 14px 0 10px; font-weight: 600; }

/* 图例 */
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 0 0 6px 4px; }
.legend-item { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-2); }
.legend-item .sw {
  width: 10px; height: 10px; border-radius: 3px; flex: none;
  background: var(--c);
}

/* 图表区 */
.chart-box { position: relative; }
.chart-box svg { display: block; width: 100%; height: 560px; }
.bar { transition: filter .12s ease, y .18s ease, height .18s ease; }
.bar-group:hover .bar, .bar-group:focus .bar, .bar-group:focus-visible .bar { filter: brightness(1.14); }
.bar-group { outline: none; }
.bar-group:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

/* 系列填充（纹理为可选的兜底通道：色弱 / 打印 / 强制色） */
.bar.s1 { fill: var(--fill-1, var(--series-1)); }
.bar.s2 { fill: var(--fill-2, var(--series-2)); }
.bar.s3 { fill: var(--fill-3, var(--series-3)); }
.bar.s4 { fill: var(--fill-4, var(--series-4)); }
.bar.s5 { fill: var(--fill-5, var(--series-5)); }
.bar.s6 { fill: var(--fill-6, var(--series-6)); }
.bar.s7 { fill: var(--fill-7, var(--series-7)); }
.bar.s8 { fill: var(--fill-8, var(--series-8)); }
html.tex { --fill-1: url(#tex-1); --fill-2: url(#tex-2); --fill-3: url(#tex-3); --fill-4: url(#tex-4);
           --fill-5: url(#tex-5); --fill-6: url(#tex-6); --fill-7: url(#tex-7); --fill-8: url(#tex-8); }
@media print {
  html { --fill-1: url(#tex-1); --fill-2: url(#tex-2); --fill-3: url(#tex-3); --fill-4: url(#tex-4);
         --fill-5: url(#tex-5); --fill-6: url(#tex-6); --fill-7: url(#tex-7); --fill-8: url(#tex-8); }
  .filters, .head-ctrls, .foot { display: none; }
  body { background: #fff; }
  main.card { border: none; margin: 0; }
}
@media (forced-colors: active) {
  html { --fill-1: url(#tex-1); --fill-2: url(#tex-2); --fill-3: url(#tex-3); --fill-4: url(#tex-4);
         --fill-5: url(#tex-5); --fill-6: url(#tex-6); --fill-7: url(#tex-7); --fill-8: url(#tex-8); }
}
@media (prefers-reduced-motion: reduce) {
  .bar { transition: none; }
}

/* 提示浮层 */
.tip {
  position: absolute; z-index: 10; pointer-events: none;
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 11px; font-size: 12px;
  box-shadow: 0 4px 14px rgba(0,0,0,.14); max-width: 280px;
}
.tip-head { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
.tip-row { display: flex; align-items: baseline; gap: 8px; }
.tip-key { width: 12px; height: 2.5px; border-radius: 2px; background: var(--c); align-self: center; flex: none; }
.tip-val { font-weight: 650; color: var(--ink-1); }
.tip-name { color: var(--ink-2); }
.tip-extra { margin-top: 6px; padding-top: 5px; border-top: 1px solid var(--grid); font-size: 11px; color: var(--muted); }

/* 数据表 */
.table-wrap { margin-top: 18px; }
h2.table-caption { font-size: 13.5px; font-weight: 650; margin: 0 0 10px; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td {
  padding: 7px 10px; text-align: right; border-bottom: 1px solid var(--grid);
  font-variant-numeric: tabular-nums;
}
th { font-weight: 600; color: var(--ink-2); }
th:first-child, td:first-child { text-align: left; color: var(--ink-2); }
tbody tr:hover td { background: var(--page); }

footer.foot { margin-top: 20px; font-size: 11.5px; color: var(--muted); line-height: 1.7; }
footer.foot p { margin: 2px 0; }
</style>
</head>
<body class="viz-root">
<main class="card">
  <header class="head">
    <div class="head-txt">
      <h1>Agents4PLC 对比 · 详细脚手架</h1>
      <p class="sub">IEC2C通过率 · 功能通过率 · 平均 Token 消耗 · 平均时间消耗</p>
    </div>
    <div class="head-ctrls">
      <a class="icon-btn" style="text-decoration:none;display:inline-flex;align-items:center" href="./index.html">← 完整对比</a>
      <button id="btnTex" class="icon-btn" aria-pressed="false" title="以 45° 纹理区分柱形（色弱识别 / 打印友好）">纹理</button>
      <button id="btnTheme" class="icon-btn" aria-pressed="false" title="切换明暗主题">深色</button>
    </div>
  </header>

  <div class="filters">
    <div class="f-group">
      <span class="f-label">指标</span>
      <button class="tab active" data-metric="rate_iecc">IEC2C 通过率</button>
      <button class="tab" data-metric="rate_func">功能通过率</button>
      <button class="tab" data-metric="token_k">平均 Token 消耗</button>
      <button class="tab" data-metric="time_s">平均时间消耗</button>
    </div>
    <span class="sep"></span>
    <div class="f-group">
      <span class="f-label">模型</span>
      <button class="tab active" data-model="DS-V4-Flash">DS-V4-Flash</button>
      <button class="tab" data-model="Qwen3-32B">Qwen3-32B</button>
    </div>
    <button id="btnTable" class="tab" aria-pressed="false">显示数据表</button>
  </div>

  <div class="ctx" id="ctxLine"></div>
  <div class="legend" id="legend"></div>

  <div class="chart-box" id="chartBox">
    <svg id="chart" role="img"></svg>
    <div id="tip" class="tip" hidden></div>
  </div>

  <div class="table-wrap" id="tableWrap" hidden>
    <h2 class="table-caption" id="tableCaption"></h2>
    <table id="dataTable"></table>
  </div>

  <footer class="foot">
    <p>说明：通过率统一换算为百分比；CodeX 系列未提供 Token 数据（表中以 — 表示）。</p>
    <p>悬停或 Tab 聚焦柱形可查看数值；开启“纹理”可改善色弱识别与打印场景的区分度。</p>
  </footer>
</main>

function fmtVal(m, v) {
  if (v == null) return '—';
  if (m === 'rate_iecc' || m === 'rate_func') {
    const p = v * 100;
    if (p <= 0.05) return '0%';
    if (p >= 99.95) return '100%';
    const r = Math.round(p * 10) / 10;
    return (r % 1 === 0 ? r.toFixed(0) : r.toFixed(1)) + '%';
  }
  if (m === 'token_k') return Math.round(v) + 'K';
  return Math.round(v) + ' 秒';
}
function fmtLabel(m, v) { // 柱顶直接标注（短）
  if (v == null) return '—';
  if (m === 'rate_iecc' || m === 'rate_func') {
    const p = v * 100;
    if (p <= 0.05) return '0%';
    if (p >= 99.95) return '100%';
    const r = Math.round(p * 10) / 10;
    return (r % 1 === 0 ? r.toFixed(0) : r.toFixed(1)) + '%';
  }

  if (m === 'rate_iecc' || m === 'rate_func') return { min: -10, max: 100, step: 20 };
  const vals = [];
  for (const r of DATA.records) if (r.model === state.model && r[m] != null) vals.push(r[m]);
  const mx = vals.length ? Math.max.apply(null, vals) : 10;
  const steps = [1, 2, 2.5, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000];
  let step = steps.find(s => s >= mx / 5) || 1000;
  return { min: 0, max: Math.max(step, Math.ceil(mx / step) * step), step };
}

    const slot = groupW / list.length;
    list.forEach((agent, i) => {
      const rec = idx[state.model + '|' + bench + '|' + agent];
      const v = rec[state.metric];
      if (v == null) return;
      const bx = xs[g] + i * slot + slot / 2;
      const tx = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      tx.setAttribute('x', bx); tx.setAttribute('y', y(v) - 4);
      tx.setAttribute('text-anchor', 'middle');
      tx.setAttribute('fill', 'var(--ink-2)');
      // 百分比标签用小字号避免相邻柱重叠；Token/时间标签较短，用 10px
      const isRate = state.metric === 'rate_iecc' || state.metric === 'rate_func';
      tx.setAttribute('font-size', isRate ? '8.5' : '10');
      tx.textContent = fmtLabel(state.metric, v);
      svg.appendChild(tx);
    });
  }

  // X 轴标签
  for (let g = 0; g < 6; g++) {
    const tx = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    tx.setAttribute('x', xs[g] + groupW / 2); tx.setAttribute('y', H - 24);
    tx.setAttribute('text-anchor', 'middle');
    tx.setAttribute('fill', 'var(--muted)'); tx.setAttribute('font-size', '12');
    tx.textContent = DATA.benchmarks[g];
    svg.appendChild(tx);
  }

  svg.setAttribute('aria-label', state.model + ' · ' + METRICS[state.metric] + ' 分组柱状图');
}

function barPath(x, y0, w, h, r) {
  if (h <= 0) return '';
  const rr = Math.min(r, h / 2, w / 2);
  const top = y0, bot = y0 + h;
  if (rr < 0.5) return 'M' + x + ',' + bot + ' h' + w + ' V' + top + ' h' + (-w) + ' Z';
  return 'M' + x + ',' + bot +
    ' V' + (top + rr) +
    ' Q' + x + ',' + top + ' ' + (x + rr) + ',' + top +
    ' H' + (x + w - rr) +
    ' Q' + (x + w) + ',' + top + ' ' + (x + w) + ',' + (top + rr) +
    ' V' + bot + ' Z';
}

/* ---------- 图例 ---------- */
function renderLegend() {
  const el = document.getElementById('legend');
  el.innerHTML = '';
  AGENTS.forEach((a, i) => {
    const it = document.createElement('span');
    it.className = 'legend-item';
    const sw = document.createElement('span');
    sw.className = 'sw';
    sw.style.setProperty('--c', 'var(--series-' + SLOTS[a] + ')');
    const nm = document.createElement('span');
    nm.textContent = a;
    it.appendChild(sw); it.appendChild(nm);
    el.appendChild(it);
  });
}

/* ---------- 数据表 ---------- */
function renderTable() {
  document.getElementById('tableCaption').textContent =
    state.model + ' · ' + METRICS[state.metric] + (UNITS[state.metric] === '%' ? '（%）' : '（' + UNITS[state.metric] + '）');
  const tbl = document.getElementById('dataTable');
  tbl.innerHTML = '';
  const thead = document.createElement('thead');
  let tr = document.createElement('tr');
  let th = document.createElement('th'); th.textContent = 'Agent';
  tr.appendChild(th);
  for (const b of DATA.benchmarks) {
    th = document.createElement('th'); th.textContent = b; tr.appendChild(th);
  }
  thead.appendChild(tr); tbl.appendChild(thead);
  const tbody = document.createElement('tbody');
  for (const a of AGENTS) {
    tr = document.createElement('tr');
    th = document.createElement('td'); th.textContent = a; tr.appendChild(th);
    for (const b of DATA.benchmarks) {
      const rec = idx[state.model + '|' + b + '|' + a];
      const td = document.createElement('td');
      td.textContent = rec ? fmtVal(state.metric, rec[state.metric]) : '—';
      tr.appendChild(td);
    }
    tbody.appendChild(tr); tbl.appendChild(tbody);
  }
}

/* ---------- 工具提示 ---------- */
function showTip(grp, rec, bench, e, viaFocus) {
  const head = document.createElement('div');
  head.className = 'tip-head';
  head.textContent = bench + ' · ' + rec.model;
  const row = document.createElement('div');
  row.className = 'tip-row';
  const key = document.createElement('span');
  key.className = 'tip-key';
  key.style.setProperty('--c', 'var(--series-' + SLOTS[rec.agent] + ')');
  const val = document.createElement('span');
  val.className = 'tip-val';
  val.textContent = rec[state.metric] == null ? '无数据' : fmtVal(state.metric, rec[state.metric]);
  const name = document.createElement('span');
  name.className = 'tip-name';
  name.textContent = rec.agent;
  row.appendChild(key); row.appendChild(val); row.appendChild(name);
  const extra = document.createElement('div');
  extra.className = 'tip-extra';
  extra.textContent = ['rate_iecc', 'rate_func', 'token_k', 'time_s']
    .filter(m => m !== state.metric)
    .map(m => METRICS[m] + ' ' + fmtVal(m, rec[m])).join(' · ');
  tip.innerHTML = '';
  tip.appendChild(head); tip.appendChild(row); tip.appendChild(extra);
  tip.hidden = false;
  if (viaFocus) {
    const box = document.getElementById('chartBox').getBoundingClientRect();
    const bar = grp.querySelector('.bar');
    const r = (bar || grp).getBoundingClientRect();
    const left = r.left - box.left + r.width / 2 - 90;
    placeTip(left, r.top - box.top - 74);
  } else {
    moveTip(e);
  }
}
function moveTip(e) {
  const box = document.getElementById('chartBox').getBoundingClientRect();
  let left = e.clientX - box.left + 14, top = e.clientY - box.top + 14;
  if (left + tip.offsetWidth > box.width - 8) left = e.clientX - box.left - tip.offsetWidth - 14;
  if (top + tip.offsetHeight > box.height - 8) top = e.clientY - box.top - tip.offsetHeight - 14;
  placeTip(Math.max(8, left), Math.max(8, top));
}
function placeTip(left, top) {
  const box = document.getElementById('chartBox');
  const bx = box.clientWidth, by = box.clientHeight;
  tip.style.left = Math.min(Math.max(8, left), bx - tip.offsetWidth - 8) + 'px';
  tip.style.top = Math.min(Math.max(8, top), by - tip.offsetHeight - 8) + 'px';
}
function hideTip() { tip.hidden = true; }

/* ---------- 事件 ---------- */
document.querySelectorAll('#metricTabs .tab, .filters .tab[data-metric]').forEach(b => {
  b.addEventListener('click', () => {
    state.metric = b.dataset.metric;
    document.querySelectorAll('[data-metric]').forEach(x => x.classList.toggle('active', x === b));
    refresh();
  });
});
document.querySelectorAll('[data-model]').forEach(b => {
  b.addEventListener('click', () => {
    state.model = b.dataset.model;
    document.querySelectorAll('[data-model]').forEach(x => x.classList.toggle('active', x === b));
    refresh();
  });
});
function refresh() {
  document.getElementById('ctxLine').textContent =
    state.model + ' · ' + METRICS[state.metric] + (UNITS[state.metric] === '%' ? '（%）' : '（单位：' + UNITS[state.metric] + '）');
  render();
  if (!document.getElementById('tableWrap').hidden) renderTable();
}

const btnTable = document.getElementById('btnTable');
btnTable.addEventListener('click', () => {
  const wrap = document.getElementById('tableWrap');
  const show = wrap.hidden;
  wrap.hidden = !show;
  btnTable.textContent = show ? '隐藏数据表' : '显示数据表';
  btnTable.setAttribute('aria-pressed', String(show));
  if (show) renderTable();
});

const btnTheme = document.getElementById('btnTheme');
function applyTheme(t) {
  if (t === 'dark') { document.documentElement.dataset.theme = 'dark'; btnTheme.textContent = '浅色'; btnTheme.setAttribute('aria-pressed', 'true'); }
  else { document.documentElement.dataset.theme = 'light'; btnTheme.textContent = '深色'; btnTheme.setAttribute('aria-pressed', 'false'); }
}
btnTheme.addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('plc-theme', next); } catch (e) {}
  applyTheme(next);
});

const btnTex = document.getElementById('btnTex');
function applyTex(on) { document.documentElement.classList.toggle('tex', on); btnTex.setAttribute('aria-pressed', String(on)); }
btnTex.addEventListener('click', () => {
  const on = !document.documentElement.classList.contains('tex');
  try { localStorage.setItem('plc-tex', on ? '1' : '0'); } catch (e) {}
  applyTex(on);
});

let resizeTimer = null;
new ResizeObserver(() => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 120); }).observe(svg);

/* ---------- 启动 ---------- */
try {
  const t = localStorage.getItem('plc-theme');
  if (t) applyTheme(t);
  const x = localStorage.getItem('plc-tex');
  if (x === '1') applyTex(true);
} catch (e) {}
renderLegend();
refresh();
</script>
</body>
</html>
